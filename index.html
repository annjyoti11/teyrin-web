<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEYRIN — Ideas, Engineered.</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
<meta name="description" content="TEYRIN — Ideas, Engineered. Building what comes before the problem.">
<meta name="theme-color" content="#050506">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050506;color:#f4f4f2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;overflow:hidden}.stage{position:relative;min-height:100svh;display:grid;place-items:center;padding:clamp(24px,5vw,64px) 22px;background:radial-gradient(ellipse at 50% 36%,#101012 0,#09090a 30%,#050506 68%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
.hero{position:relative;z-index:1;width:min(760px,92vw);text-align:center;transform:translateY(-1vh)}
.mark-wrap{position:relative;width:min(218px,46vw);aspect-ratio:1;margin:0 auto clamp(12px,2vh,20px);display:grid;place-items:center;opacity:0;transform:translateY(7px) scale(.985);animation:markIn 1.6s cubic-bezier(.22,.7,.2,1) .15s forwards}
.mark{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.42))}
.trace{position:absolute;inset:19% 17%;pointer-events:none;opacity:0;border-radius:50%;background:radial-gradient(circle,rgba(194,103,55,.12) 0,rgba(194,103,55,.045) 34%,transparent 70%);filter:blur(16px);transform:scale(.82)}
.trace.live{animation:trace 2.35s cubic-bezier(.4,0,.2,1)}
@keyframes trace{0%,100%{opacity:0;transform:scale(.82)}42%{opacity:.72;transform:scale(1.05)}70%{opacity:.18;transform:scale(1.12)}}@keyframes markIn{to{opacity:1;transform:none}}
.wordmark{display:block;width:min(345px,60vw);height:auto;margin:0 auto;opacity:0;transform:translateY(5px);animation:reveal 1.5s ease .75s forwards}
.tag{margin-top:9px;font-size:clamp(8px,.9vw,10px);font-weight:500;letter-spacing:.46em;margin-right:-.46em;color:#a86743;text-transform:uppercase;opacity:0;animation:reveal 1.5s ease 1.1s forwards}
.promise{margin:clamp(44px,6.5vh,64px) auto 0;max-width:610px;font-size:clamp(16px,1.55vw,19px);font-weight:300;line-height:1.55;letter-spacing:.015em;color:#c7c7c3;opacity:0;transform:translateY(7px);animation:reveal 1.8s ease 1.75s forwards}
.state{position:fixed;z-index:2;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;text-align:center;font-size:9px;letter-spacing:.38em;margin-right:-.38em;color:#aaa7a2;text-transform:uppercase;opacity:0;transition:opacity 3.2s ease;filter:drop-shadow(0 0 10px rgba(190,112,65,.08))}
.state.visible{opacity:.72}@keyframes reveal{to{opacity:1;transform:none}}
@media(max-width:600px){.hero{transform:translateY(-3vh)}.mark-wrap{width:min(188px,49vw)}.wordmark{width:min(300px,76vw)}.tag{font-size:8px;letter-spacing:.36em;margin-right:-.36em}.promise{max-width:330px;margin-top:48px;font-size:16px;line-height:1.55}.state{font-size:8px;letter-spacing:.28em;margin-right:-.28em}}@media(max-height:650px){.mark-wrap{width:min(180px,38vw);margin-bottom:14px}.promise{margin-top:30px}.state{bottom:14px}}
.state i{display:block;width:min(360px,44vw);height:1px;margin:13px auto 0;background:linear-gradient(90deg,transparent,rgba(168,103,67,.12) 36%,rgba(222,151,105,.8) 50%,rgba(168,103,67,.12) 64%,transparent);box-shadow:0 0 10px rgba(202,122,73,.32);transform:scaleX(.18);opacity:0;transition:transform 3.4s ease,opacity 3.4s ease}.state.visible i{transform:scaleX(1);opacity:.72}@media(prefers-reduced-motion:reduce){.trace{display:none}.mark-wrap,.wordmark,.tag,.promise{animation:none;opacity:1;transform:none}.state{transition:none}}
</style>
</head>
<body><main class="stage"><div class="grain"></div><section class="hero" aria-label="TEYRIN">
<div class="mark-wrap"><img class="mark" alt="TEYRIN symbol" src="teyrin-symbol.png"><div class="trace" aria-hidden="true"></div></div>
<img class="wordmark" src="teyrin-wordmark-light.png" alt="TEYRIN"><div class="tag">Ideas, Engineered.</div>
<p class="promise">We’re building what comes before the problem.</p></section>
<div class="state" aria-live="off"><span>Thought, becoming system.</span><i aria-hidden="true"></i></div></main>
<script>
(()=>{const trace=document.querySelector('.trace'),state=document.querySelector('.state');if(matchMedia('(prefers-reduced-motion: reduce)').matches){state.classList.add('visible');return}
let count=0;function pulse(){trace.classList.remove('live');void trace.offsetWidth;trace.classList.add('live');count++;if(count===1)setTimeout(()=>state.classList.add('visible'),1500);setTimeout(pulse,15000+Math.random()*18000)}
setTimeout(pulse,6500+Math.random()*4500)})();
</script></body></html>
